services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - app.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:15.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thaibev
    ports:
      - "54321:5432"


volumes:
  pgdata:
